schema: spec-driven

context: |
  Projeto MobiCare, da Associação Acompanhar (IPSS). A plataforma gere pedidos
  de transporte e acompanhamento de pessoas seniores a consultas e exames.
  A interface e a documentação do projeto usam português de Portugal.

  A SRS é a fonte dos requisitos, regras de negócio e casos de teste.
  Versão disponível no repositório: assets/E4-SRS/E4a_SRS_MobiCare.pdf.

  Atores principais: utente, familiar ou cuidador, técnico da IPSS,
  coordenador e voluntário. Entidades principais: Utente, Perfil de
  Mobilidade, Pedido, Voluntário, Viagem de Ida, Viagem de Regresso e Banco de Tempo.

  A aplicação web é responsiva e privilegia a utilização em telemóvel.
  Em caso de perda de rede, os pedidos e eventos de check-in ficam guardados
  no dispositivo e são sincronizados quando a ligação regressa (RNF-05).
  O cartão físico MobiCare permite a identificação do utente por QR ou NFC.

  O primeiro incremento abrange UC-01-S1, UC-01-S2, UC-01-S3, UC-02-S1,
  UC-04-S1, UC-06-S1, UC-06-S2 e UC-06-S3. O check-in do UC-03-S1
  pertence ao terceiro épico.

  Arquitetura: docs/design/E5-Desenho.md. A aplicação do utente e a consola
  do técnico partilham uma API e as mesmas regras de negócio. Os módulos
  tratam dos pedidos e da triagem, da seleção de transporte, do regresso,
  da persistência, da sincronização e do envio de notificações.

  ADR-001: docs/adr/ADR-001-stack.md. A proposta de stack inclui uma PWA
  em React com TypeScript, API em Node.js/Express, SQLite no servidor, IndexedDB
  no browser e Playwright Test para os testes automáticos do incremento.

  O contrato da API consta da secção 3.1 do E5. A secção 3.2 associa cada
  slice às operações e aos módulos envolvidos. O envio de SMS utiliza
  um adaptador que pode ser substituído por um simulador durante os testes.

  A arquitetura global está documentada em openspec/architecture.md.
  Consultar este documento antes de propor, desenhar ou implementar
  alterações ao sistema, respeitando as decisões arquiteturais e os ADR.
rules:
  proposal:
    - "Identificar o slice, o objetivo da alteração e os casos de teste da SRS abrangidos."
    - "Delimitar o trabalho ao comportamento previsto para o slice."

  specs:
    - "Usar os IDs da SRS nos requisitos e nas referências às regras de negócio, por exemplo UC-01 e BR-01."
    - "Identificar cada scenario com o ID exato do caso de teste, por exemplo TC-UC01-01."
    - "Usar SHALL nos requisitos e GIVEN/WHEN/THEN nos cenários."
    - "Preservar os dados de entrada e o resultado esperado da SRS. Registar decisões sobre módulos, endpoints e tecnologia no design.md."

  design:
    - "Identificar os módulos da secção 2.3 do E5 e as operações da API afetadas pelo slice."
    - "Referir os ADR aplicáveis. Um desvio à arquitetura exige um novo ADR."
    - "Descrever, quando aplicável, o que fica gravado após uma falha de ligação e como se evitam duplicados ao repetir a operação."

  tasks:
    - "Incluir uma tarefa de implementação por comportamento e uma tarefa de teste automático por scenario."
    - "Começar o nome de cada teste pelo ID exato do caso de teste da SRS."
    - "Comparar os dados usados e o resultado observado com o respetivo caso de teste da SRS."
    - "Arquivar a change apenas depois da revisão das alterações, com todas as tarefas concluídas e os testes do slice a passar."